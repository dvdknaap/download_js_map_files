exclude: ^\.agents/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 26.3.0
    hooks:
      - id: black
        args:
          - --config=pyproject.toml

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort (python)

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: bash -c "PYLINTHOME=/tmp/download-js-map-files-pylint .venv/bin/python -m pylint src/ tests/unit/ --rcfile=.pylintrc --max-line-length=120"
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy src/ --strict
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
